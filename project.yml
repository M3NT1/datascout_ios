name: DataScout
options:
  bundleIdPrefix: com.datascout
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DataScout:
    type: application
    platform: iOS
    sources:
      - path: DataScout
        excludes:
          - "**/*.entitlements"
          - "Resources/Info.plist"
    entitlements:
      path: DataScout/DataScout.entitlements
    info:
      path: DataScout/Resources/Info.plist
    dependencies:
      - target: DataScoutWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascout.app
        INFOPLIST_FILE: DataScout/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

  DataScoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DataScoutWidgets
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: DataScout/Models
      - path: DataScout/Core/AppGroupBridge.swift
      - path: DataScout/Core/DataPlanEngine.swift
    entitlements:
      path: DataScoutWidgets/DataScoutWidgets.entitlements
    info:
      path: DataScoutWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascout.app.widgets
        INFOPLIST_FILE: DataScoutWidgets/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

  DataScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DataScoutTests
    dependencies:
      - target: DataScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascout.app.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
