name: DataScout
options:
  bundleIdPrefix: hu.m3nt1
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: TYZM6FTNXW
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "4"
targets:
  DataScout:
    type: application
    platform: iOS
    sources:
      - path: DataScout
        excludes:
          - "**/*.entitlements"
          - "Resources/Info.plist"
    entitlements:
      path: DataScout/DataScout.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)hu.m3nt1.datascout
    info:
      path: DataScout/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - target: DataScoutWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.m3nt1.datascout
        INFOPLIST_FILE: DataScout/Resources/Info.plist
        DEVELOPMENT_TEAM: TYZM6FTNXW
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DataScoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DataScoutWidgets
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: DataScout/Models
      - path: DataScout/Core/AppGroupBridge.swift
      - path: DataScout/Core/DataPlanEngine.swift
    entitlements:
      path: DataScoutWidgets/DataScoutWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)hu.m3nt1.datascout
    info:
      path: DataScoutWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.m3nt1.datascout.widgets
        INFOPLIST_FILE: DataScoutWidgets/Info.plist
        DEVELOPMENT_TEAM: TYZM6FTNXW
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  DataScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DataScoutTests
    dependencies:
      - target: DataScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.m3nt1.datascout.tests
        DEVELOPMENT_TEAM: TYZM6FTNXW
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES


